  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif
    }
    
    body {
      background: #0a1028;
      max-width: 430px;
      margin: 0 auto;
      color: #fff
    }
    
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px
    }
    
    .walletBtn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #131b36;
      border: 1px solid #22305a;
      border-radius: 24px;
      padding: 7px 14px;
      cursor: pointer;
      transition: all 0.2s
    }
    
    .walletBtn:hover {
      border-color: #3a5aaa
    }
    
    .blue {
      background: linear-gradient(180deg, #2f61ff, #1e44d6);
      border-radius: 18px;
      margin: 10px 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #4a6fff
    }
    
    .yellow {
      background: #ffea00;
      color: #000;
      border: 0;
      padding: 10px 18px;
      border-radius: 24px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s
    }
    
    .yellow:hover {
      background: #ffd600
    }
    
    .box {
      background: #101938;
      border: 1px solid #1d2a55;
      border-radius: 16px;
      margin: 10px 12px;
      padding: 12px
    }
    
    .match {
      background: #101938;
      border: 1px solid #1d2a55;
      border-radius: 14px;
      margin: 8px 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }
    
    .join {
      background: #2b5bff;
      border: 0;
      color: #fff;
      padding: 9px 20px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s
    }
    
    .join:hover {
      background: #1a3fee
    }
    
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px 12px
    }
    
    .card {
      background: #101938;
      border: 1px solid #1d2a55;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      position: relative
    }
    
    .play {
      background: #ffea00;
      color: #000;
      border: 0;
      width: 100%;
      padding: 9px;
      border-radius: 24px;
      font-weight: 900;
      margin-top: 10px;
      cursor: pointer;
      transition: all 0.2s
    }
    
    .play:hover {
      background: #ffd600
    }
    
    .tag {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 6px;
      color: #fff
    }
    
    .new {
      background: #ff2742
    }
    
    .hot {
      background: #ff8a00
    }
    
    .hide {
      display: none
    }
